plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dayguess.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dayguess.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Clé fixe (dans le dépôt) : chaque nouvel APK s'installe par-dessus l'ancien, sans perdre les scores.
    signingConfigs {
        dayguess {
            storeFile file('dayguess.keystore')
            storePassword 'dayguess123'
            keyAlias 'dayguess'
            keyPassword 'dayguess123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signé avec la clé fixe ci-dessus : suffisant pour installer l'APK soi-même
            // (pas pour le Play Store : il faudra alors une vraie clé de publication).
            signingConfig signingConfigs.dayguess
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
