plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dayguess.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dayguess.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signé avec la clé de debug : suffisant pour installer l'APK soi-même
            // (pas pour le Play Store).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
